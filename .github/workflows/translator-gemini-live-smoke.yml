name: Translator Gemini live smoke (one paid request, manual only)

on:
  workflow_dispatch:
    inputs:
      authorize_billable:
        description: 'Required explicit paid Gemini API authorization'
        type: choice
        required: true
        default: 'NO'
        options: ['NO', 'YES']
      transport:
        description: 'Protocol to test'
        type: choice
        required: true
        default: html_v0
        options: [html_v0, atoms_v1]
      model:
        description: 'Gemini model listed for generateContent by the protected VPS diagnostic'
        type: choice
        required: true
        default: gemini-3.8-flash
        options: [gemini-3.8-flash, gemini-3.6-flash, gemini-3.5-flash-lite]

permissions:
  contents: read

concurrency:
  group: chaptera-translator-paid-live-smoke
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 6
    env:
      ARARRA_SHA: b36add155f4eaecb65ebf13df8bcbdc44024a3e4
      LIVE_TRANSPORT: ${{ inputs.transport }}
      LIVE_MODEL: ${{ inputs.model }}
      PAID_AUTHORIZATION: ${{ inputs.authorize_billable }}
    steps:
      - name: Verify one-request consent and protected credential availability
        env:
          GEMINI_KEY: ${{ secrets.TRANSLATOR_GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          [[ "$PAID_AUTHORIZATION" == 'YES' ]] || { echo 'Explicit paid authorization required'; exit 2; }
          [[ "$LIVE_TRANSPORT" =~ ^(html_v0|atoms_v1)$ ]]
          [[ "$LIVE_MODEL" =~ ^(gemini-3\.8-flash|gemini-3\.6-flash|gemini-3\.5-flash-lite)$ ]]
          test -n "$GEMINI_KEY" || { echo 'Missing protected TRANSLATOR_GEMINI_API_KEY'; exit 2; }
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure pinned SSH identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY" && test -n "$SSH_KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Transfer vetted script and one protected key through SSH stdin
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          GEMINI_KEY: ${{ secrets.TRANSLATOR_GEMINI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$USER" && test -n "$GEMINI_KEY"
          bash -n deploy/translator/run-live-smoke.sh
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes \
            deploy/translator/run-live-smoke.sh \
            "$USER@$HOST:chaptera-translator-incoming/$ARARRA_SHA/run-live-smoke.sh"
          printf '%s\n' "$GEMINI_KEY" | ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$USER@$HOST" "bash 'chaptera-translator-incoming/$ARARRA_SHA/run-live-smoke.sh' '$ARARRA_SHA' '$LIVE_TRANSPORT' '$LIVE_MODEL'"
