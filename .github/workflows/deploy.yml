name: Deploy production

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chaptera-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct and validate artifact
        shell: bash
        run: |
          set -euo pipefail
          cat site/artifact4k.b64.* | base64 -d > site/chaptera-landing-online-ready.zip
          echo "3e43a2582a5871f716b04be8d82403ab28f13a8d3476c007d44c133692221e79  site/chaptera-landing-online-ready.zip" | sha256sum -c -
          rm -rf .deploy
          mkdir .deploy
          unzip -q site/chaptera-landing-online-ready.zip -d .deploy
          install -m 0644 site/favicon.svg .deploy/chaptera-landing/assets/favicon.svg
          install -m 0644 site/social-preview.png .deploy/chaptera-landing/social-preview.png
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          root = Path(".deploy/chaptera-landing")
          config_path = root / "config.json"
          overrides = json.loads(Path("site/production-overrides.json").read_text())
          config = json.loads(config_path.read_text())
          config.update(overrides)
          config_path.write_text(json.dumps(config, ensure_ascii=False, indent=2) + "\n")

          index_path = root / "index.html"
          html = index_path.read_text()
          html = re.sub(r'\s*<meta\s+name=["\']description["\'][^>]*>\s*', "\n", html, flags=re.I)
          html = re.sub(r'\s*<link\s+rel=["\']canonical["\'][^>]*>\s*', "\n", html, flags=re.I)
          html = re.sub(r'\s*<meta\s+(?:property|name)=["\'](?:og:[^"\']+|twitter:[^"\']+)["\'][^>]*>\s*', "\n", html, flags=re.I)
          start = "<!-- chaptera-social-preview:start -->"
          end = "<!-- chaptera-social-preview:end -->"
          if start in html and end in html:
              a = html.index(start)
              b = html.index(end, a) + len(end)
              html = html[:a] + html[b:]
          social = Path("site/social-preview-meta.html").read_text().strip()
          if "</head>" not in html:
              raise SystemExit("landing index.html has no </head>")
          html = html.replace("</head>", social + "\n</head>", 1)
          index_path.write_text(html)
          PY
          test -f .deploy/chaptera-landing/index.html
          test -f .deploy/chaptera-landing/assets/favicon.svg
          test -f .deploy/chaptera-landing/social-preview.png
          cmp site/favicon.svg .deploy/chaptera-landing/assets/favicon.svg
          cmp site/social-preview.png .deploy/chaptera-landing/social-preview.png
          grep -q 'property="og:image" content="https://chaptera.online/social-preview.png"' .deploy/chaptera-landing/index.html
          grep -q 'name="twitter:card" content="summary_large_image"' .deploy/chaptera-landing/index.html
          python -m json.tool .deploy/chaptera-landing/config.json >/dev/null
          node --check .deploy/chaptera-landing/assets/site.js

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload release
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          RELEASE: ${{ github.sha }}
        run: |
          set -euo pipefail
          ssh "$USER@$HOST" "mkdir -p /var/www/chaptera/releases/$RELEASE"
          rsync -az --delete .deploy/chaptera-landing/ "$USER@$HOST:/var/www/chaptera/releases/$RELEASE/"
          ssh "$USER@$HOST" "rm -f /var/www/chaptera/current.new && ln -s /var/www/chaptera/releases/$RELEASE /var/www/chaptera/current.new && mv -Tf /var/www/chaptera/current.new /var/www/chaptera/current"
          ssh "$USER@$HOST" "ls -1dt /var/www/chaptera/releases/* | tail -n +6 | xargs -r rm -rf"

      - name: Production smoke
        run: |
          set -euo pipefail
          curl -fsS https://chaptera.online/ | grep -q 'property="og:image" content="https://chaptera.online/social-preview.png"'
          curl -fsSI https://chaptera.online/social-preview.png | grep -qi 'content-type: image/png'
          curl -fsS https://chaptera.online/reader/ >/dev/null
          curl -fsS https://chaptera.online/privacy/ >/dev/null
          curl -fsS https://reader.chaptera.online/ | grep -q 'Chaptera'
