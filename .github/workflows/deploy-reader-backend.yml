name: Deploy Cloud Reader backend

on:
  # Production mutates a real host. Merge/push must never install "latest".
  workflow_dispatch:
    inputs:
      release_sha:
        description: "Exact 40-hex rar2 main commit SHA of the intended Cloud Reader packet"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: chaptera-reader-backend-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Resolve explicitly pinned Reader release
        id: release
        env:
          PINNED_RELEASE_SHA: ${{ inputs.release_sha }}
        shell: bash
        run: |
          set -euo pipefail
          sha="${PINNED_RELEASE_SHA}"
          [[ "${sha}" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Production release_sha must be an exact 40-hex rar2 commit SHA"
            exit 1
          }
          tag="cloud-reader-${sha}"
          # Resolve this exact immutable release. Never fall back to newest:
          # another agent can publish a newer rar2 packet meanwhile.
          release_url="https://api.github.com/repos/Lalalalendia/rar2/releases/tags/${tag}"
          release_json="$(curl -fsSL -H 'Accept: application/vnd.github+json' "${release_url}")"
          printf '%s\n' "${release_json}" | jq -e --arg tag "${tag}" \
            '.tag_name == $tag and .draft == false' >/dev/null
          url="$(printf '%s\n' "${release_json}" | jq -er \
            'first(.assets[] | select(.name == "chaptera-cloud-reader-linux-amd64.tar.gz") | .browser_download_url)')"
          [[ "${url}" == "https://github.com/Lalalalendia/rar2/releases/download/${tag}/chaptera-cloud-reader-linux-amd64.tar.gz" ]] || {
            echo "::error::Pinned Reader release has an unexpected asset location"
            exit 1
          }
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"
          echo "url=${url}" >> "${GITHUB_OUTPUT}"

      - name: Download and verify release packet
        env:
          RELEASE_URL: ${{ steps.release.outputs.url }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .reader-release/unpacked
          curl -fsSL --retry 4 --retry-delay 2             "${RELEASE_URL}"             -o .reader-release/chaptera-cloud-reader-linux-amd64.tar.gz
          tar -xzf .reader-release/chaptera-cloud-reader-linux-amd64.tar.gz             -C .reader-release/unpacked
          (
            cd .reader-release/unpacked
            sha256sum -c SHA256SUMS
            test "$(tr -d '\r\n' < COMMIT_SHA)" = "${RELEASE_SHA}"
          )

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Capture host preflight
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh "${USER}@${HOST}" '
            set +e
            echo "=== identity ==="
            id
            echo
            echo "=== sudo ==="
            sudo -n -l 2>&1
            echo
            echo "=== paths ==="
            ls -ld /etc/nginx /etc/nginx/sites-available /etc/nginx/sites-enabled /etc/systemd/system /opt/chaptera /var/www/chaptera /var/www/chaptera/current 2>&1
            echo
            echo "=== dns ==="
            getent ahostsv4 reader.chaptera.online 2>&1
            echo
            echo "=== listeners ==="
            ss -ltn 2>&1
            echo
            echo "=== reader service ==="
            systemctl --no-pager --full status chaptera-reader.service 2>&1
            echo
            echo "=== existing incoming ==="
            find "$HOME/chaptera-reader-incoming" -maxdepth 2 -type f -printf "%p %s bytes\n" 2>&1
          ' > host-preflight.txt

      - name: Upload host preflight
        uses: actions/upload-artifact@v4
        with:
          name: chaptera-reader-host-preflight
          path: host-preflight.txt
          if-no-files-found: error
          retention-days: 7

      - name: Upload Reader packet and bootstrap
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          SHA: ${{ steps.release.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          slot="/home/${USER}/chaptera-reader-incoming/${SHA}"
          ssh "${USER}@${HOST}" "mkdir -p '${slot}'"
          scp .reader-release/chaptera-cloud-reader-linux-amd64.tar.gz             "${USER}@${HOST}:${slot}/chaptera-cloud-reader-linux-amd64.tar.gz"
          scp cloud-reader/deploy/bootstrap-reader-deployer.sh             "${USER}@${HOST}:${slot}/bootstrap-reader-deployer.sh"

      - name: Ensure restricted deploy bridge
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          SHA: ${{ steps.release.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          slot="/home/${USER}/chaptera-reader-incoming/${SHA}"
          if ssh "${USER}@${HOST}"             "sudo -n /usr/local/sbin/chaptera-reader-deploy --version"             2>/dev/null | grep -q '^chaptera-reader-deploy-v1$'; then
            exit 0
          fi

          ssh "${USER}@${HOST}" "
            set -e
            if sudo -n true 2>/dev/null; then
              chmod 700 '${slot}/bootstrap-reader-deployer.sh'
              sudo -n bash '${slot}/bootstrap-reader-deployer.sh' '${USER}'
            else
              echo 'ROOT_BOOTSTRAP_REQUIRED'
              echo 'Run once as root: bash ${slot}/bootstrap-reader-deployer.sh ${USER}'
              exit 90
            fi
          "

      - name: Deploy Reader backend
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          SHA: ${{ steps.release.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          archive="/home/${USER}/chaptera-reader-incoming/${SHA}/chaptera-cloud-reader-linux-amd64.tar.gz"
          ssh "${USER}@${HOST}"             "sudo -n /usr/local/sbin/chaptera-reader-deploy '${SHA}' '${archive}'"

      - name: Real PUB physical acceptance
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          SHA: ${{ steps.release.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          fixture_sha="ffed034ac87e679f0bd08ff9cf74ad11c0e0e510a42b1bc1a7502415f6c29c87"
          curl -fsSL             https://raw.githubusercontent.com/apache/poi/942d95d85b15d0dfdb3bc9ba1b4f273f277757c8/test-data/publisher/SampleBrochure.pub             -o /tmp/chaptera-reader-acceptance.pub
          echo "${fixture_sha}  /tmp/chaptera-reader-acceptance.pub" | sha256sum -c -
          scp /tmp/chaptera-reader-acceptance.pub             "${USER}@${HOST}:/home/${USER}/chaptera-reader-acceptance.pub"
          ssh "${USER}@${HOST}"             "python3 /opt/chaptera/current/run_cloud_reader_guest_host_acceptance.py               --fixture /home/${USER}/chaptera-reader-acceptance.pub               --out /home/${USER}/chaptera-reader-acceptance-${SHA}.json"

      - name: Public smoke
        shell: bash
        run: |
          set -euo pipefail

          echo "=== public DNS ==="
          getent ahostsv4 reader.chaptera.online || true
          getent ahostsv6 reader.chaptera.online || true

          echo "=== HTTP must redirect to HTTPS ==="
          http_headers="$(mktemp)"
          curl -fsS -o /dev/null -D "${http_headers}" http://reader.chaptera.online/
          cat "${http_headers}"
          grep -Eq '^HTTP/[^ ]+ (301|308)' "${http_headers}"
          grep -Fqi 'Location: https://reader.chaptera.online/' "${http_headers}"

          echo "=== live TLS certificate ==="
          openssl s_client             -connect reader.chaptera.online:443             -servername reader.chaptera.online             -verify_return_error             </dev/null 2>/dev/null             | openssl x509 -noout -subject -issuer -dates -ext subjectAltName

          echo "=== HTTPS content ==="
          curl -fsS https://reader.chaptera.online/ | grep -q 'Chaptera'
          curl -fsS https://reader.chaptera.online/favicon.svg | grep -q '#315EF5'

          echo "=== Public temporary guest editor path allowlist ==="
          allowed=(
            /editor/temporary-preview
            /editor/temporary-editor-preview.mjs
            /editor/temporary-editor-preview.css
            /editor/temporary-edit-browser-session-v0.mjs
            /editor/temporary-edit-move-client-v1.mjs
            /editor/interaction-v1.mjs
            /editor/reader-scene-editor-interaction-v1.mjs
            /cloud-reader/render-v1.mjs
          )
          for path in "${allowed[@]}"; do
            actual="$(curl --silent --show-error --max-time 20 \
              --output /dev/null --write-out '%{http_code}' \
              "https://reader.chaptera.online${path}")"
            [[ "${actual}" == 200 ]] || {
              echo "::error::Public guest static path ${path} returned ${actual}, expected 200"
              exit 1
            }
          done

          echo "=== Public Product/OIDC/unlisted surface denylist ==="
          blocked=(
            /editor/product-editor-entry-v1.mjs
            /editor/temporary-preview-other
            /v1/editor/projects
            /v1/auth/session
          )
          for path in "${blocked[@]}"; do
            actual="$(curl --silent --show-error --max-time 20 \
              --output /dev/null --write-out '%{http_code}' \
              "https://reader.chaptera.online${path}")"
            [[ "${actual}" == 404 ]] || {
              echo "::error::Private/unlisted path ${path} returned ${actual}, expected 404"
              exit 1
            }
          done
          # HTTP 200 cannot prove that Nginx serves assets from the chosen
          # Chaptera Rust build; verify the actual public bytes separately.

      - name: Verify publicly served guest scripts match exact deployed rar2 commit
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${RELEASE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          work="$(mktemp -d)"
          trap 'rm -rf "${work}"' EXIT
          # Product Editor assets (including this Guest subset) are Rust
          # include_bytes!, not static files deployed by chaptera-site.
          # Fail closed if Nginx is still serving an older binary or cache.
          for script in \
            temporary-editor-preview.mjs \
            temporary-edit-browser-session-v0.mjs \
            temporary-edit-move-client-v1.mjs \
            interaction-v1.mjs \
            reader-scene-editor-interaction-v1.mjs
          do
            curl --fail --location --silent --show-error --retry 3 \
              "https://raw.githubusercontent.com/Lalalalendia/rar2/${RELEASE_SHA}/apps/web/${script}" \
              --output "${work}/expected"
            curl --fail --silent --show-error --max-time 20 \
              -H 'Cache-Control: no-cache' \
              "https://reader.chaptera.online/editor/${script}" \
              --output "${work}/actual"
            if ! cmp --silent "${work}/expected" "${work}/actual"; then
              echo "::error::Public script ${script} is not from selected rar2 release_sha"
              exit 1
            fi
            echo "Verified public guest script identity: ${script}"
          done
          # Source-neutral receipts only: publish SHA and module names,
          # never private source bytes, guest tokens or session IDs.
          echo "Public guest static assets match release ${RELEASE_SHA}"
          # Full public browser upload/edit/IDML+PDF/delete stays a separate
          # operator acceptance gate; no production GO inferred here.


