name: Deploy Cloud Reader backend

on:
  # Auto-deploy only immutable Reader packets published from protected rar2/main.
  # Manual exact-SHA dispatch remains available for rollback/reinstall.
  schedule:
    - cron: "*/10 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-reader-backend.yml"
      - "cloud-reader/deploy/bootstrap-reader-deployer.sh"
  workflow_dispatch:
    inputs:
      release_sha:
        description: "Exact 40-hex rar2 main commit SHA for manual deploy/rollback"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: chaptera-reader-backend-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 25
    outputs:
      release_sha: ${{ steps.release.outputs.sha }}
      already_current: ${{ steps.current.outputs.already_current }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve immutable Reader release
        id: release
        env:
          PINNED_RELEASE_SHA: ${{ inputs.release_sha }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            sha="${PINNED_RELEASE_SHA}"
            [[ "${sha}" =~ ^[0-9a-f]{40}$ ]] || {
              echo "::error::Manual production release_sha must be an exact 40-hex rar2 commit SHA"
              exit 1
            }
            tag="cloud-reader-${sha}"
          else
            # GitHub Releases API list order is not a deployment authority.
            # Select the newest eligible immutable packet by published_at.
            releases="$(curl -fsSL --retry 4 --retry-delay 2 \
              -H 'Accept: application/vnd.github+json' \
              'https://api.github.com/repos/Lalalalendia/rar2/releases?per_page=30')"
            tag="$(printf '%s\n' "${releases}" | jq -er '
              [.[] |
                select(.draft == false and .published_at != null) |
                select(.tag_name | test("^cloud-reader-[0-9a-f]{40}$")) |
                select(.assets | any(.name == "chaptera-cloud-reader-linux-amd64.tar.gz"))
              ] | max_by(.published_at) | .tag_name')"
            sha="${tag#cloud-reader-}"
          fi

          [[ "${sha}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${tag}" == "cloud-reader-${sha}" ]]

          release_url="https://api.github.com/repos/Lalalalendia/rar2/releases/tags/${tag}"
          release_json="$(curl -fsSL --retry 4 --retry-delay 2 \
            -H 'Accept: application/vnd.github+json' "${release_url}")"
          printf '%s\n' "${release_json}" | jq -e --arg tag "${tag}" --arg sha "${sha}" '
            .tag_name == $tag and .draft == false and
            .target_commitish == $sha and
            (.assets | any(.name == "chaptera-cloud-reader-linux-amd64.tar.gz" and
              (.digest | strings | startswith("sha256:"))))
          ' >/dev/null

          # Auto mode may follow the newest immutable packet only if its commit
          # is still an ancestor of protected rar2/main. This blocks releases
          # from abandoned/foreign histories.
          compare_json="$(curl -fsSL --retry 4 --retry-delay 2 \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/Lalalalendia/rar2/compare/${sha}...main")"
          printf '%s\n' "${compare_json}" | jq -e '
            .behind_by == 0 and (.status == "ahead" or .status == "identical")
          ' >/dev/null || {
            echo "::error::Selected Reader release is not an ancestor of protected rar2/main"
            exit 1
          }

          url="$(printf '%s\n' "${release_json}" | jq -er '
            first(.assets[] | select(.name == "chaptera-cloud-reader-linux-amd64.tar.gz") | .browser_download_url)')"
          [[ "${url}" == "https://github.com/Lalalalendia/rar2/releases/download/${tag}/chaptera-cloud-reader-linux-amd64.tar.gz" ]] || {
            echo "::error::Reader release has an unexpected asset location"
            exit 1
          }

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"
          echo "url=${url}" >> "${GITHUB_OUTPUT}"
          echo "Resolved Reader release ${tag} for ${GITHUB_EVENT_NAME}"

      - name: Download and verify release packet
        env:
          RELEASE_URL: ${{ steps.release.outputs.url }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .reader-release/unpacked
          curl -fsSL --retry 4 --retry-delay 2             "${RELEASE_URL}"             -o .reader-release/chaptera-cloud-reader-linux-amd64.tar.gz
          tar -xzf .reader-release/chaptera-cloud-reader-linux-amd64.tar.gz             -C .reader-release/unpacked
          (
            cd .reader-release/unpacked
            sha256sum -c SHA256SUMS
            test "$(tr -d '\r\n' < COMMIT_SHA)" = "${RELEASE_SHA}"
          )

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Detect already installed automatic release
        id: current
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          SHA: ${{ steps.release.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HOST}"
          test -n "${USER}"
          actual="$(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "${USER}@${HOST}" 'readlink -f /opt/chaptera/current 2>/dev/null || true')"
          expected="/opt/chaptera/releases/${SHA}"
          echo "installed_path=${actual}" >> "${GITHUB_OUTPUT}"
          prior_previous="$(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "${USER}@${HOST}" 'readlink -f /opt/chaptera/previous 2>/dev/null || true')"
          echo "previous_path=${prior_previous}" >> "${GITHUB_OUTPUT}"
          if [[ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" && "${actual}" == "${expected}" ]]; then
            echo "already_current=true" >> "${GITHUB_OUTPUT}"
            echo "Automatic deploy no-op: ${SHA} is already installed"
          else
            echo "already_current=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Verify rollback-aware installer before host change
        if: steps.current.outputs.already_current != 'true'
        shell: bash
        run: |
          set -euo pipefail
          packet_installer=".reader-release/unpacked/install-reader-host.sh"
          test -s "${packet_installer}"
          bash -n "${packet_installer}"
          # Old release packets must not silently remove the rollback pointer
          # when the operator explicitly selects an earlier SHA.
          grep -Fq 'PREVIOUS="/opt/chaptera/previous"' "${packet_installer}"
          grep -Fq 'ln -sfn "${old_release}" "${PREVIOUS}"' "${packet_installer}"
          grep -Fq 'ln -sfn "${RELEASE}" "${CURRENT}"' "${packet_installer}"
          echo "Selected packet has rollback-aware immutable installer"

      - name: Capture host preflight
        if: steps.current.outputs.already_current != 'true'
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh "${USER}@${HOST}" '
            set +e
            echo "=== identity ==="
            id
            echo
            echo "=== sudo ==="
            sudo -n -l 2>&1
            echo
            echo "=== paths ==="
            ls -ld /etc/nginx /etc/nginx/sites-available /etc/nginx/sites-enabled /etc/systemd/system /opt/chaptera /var/www/chaptera /var/www/chaptera/current 2>&1
            echo
            echo "=== dns ==="
            getent ahostsv4 reader.chaptera.online 2>&1
            echo
            echo "=== listeners ==="
            ss -ltn 2>&1
            echo
            echo "=== reader service ==="
            systemctl --no-pager --full status chaptera-reader.service 2>&1
            echo
            echo "=== existing incoming ==="
            find "$HOME/chaptera-reader-incoming" -maxdepth 2 -type f -printf "%p %s bytes\n" 2>&1
          ' > host-preflight.txt

      - name: Upload host preflight
        if: steps.current.outputs.already_current != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: chaptera-reader-host-preflight
          path: host-preflight.txt
          if-no-files-found: error
          retention-days: 7

      - name: Upload Reader packet and bootstrap
        if: steps.current.outputs.already_current != 'true'
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          SHA: ${{ steps.release.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          slot="/home/${USER}/chaptera-reader-incoming/${SHA}"
          ssh "${USER}@${HOST}" "mkdir -p '${slot}'"
          scp .reader-release/chaptera-cloud-reader-linux-amd64.tar.gz             "${USER}@${HOST}:${slot}/chaptera-cloud-reader-linux-amd64.tar.gz"
          scp cloud-reader/deploy/bootstrap-reader-deployer.sh             "${USER}@${HOST}:${slot}/bootstrap-reader-deployer.sh"

      - name: Ensure restricted deploy bridge
        if: steps.current.outputs.already_current != 'true'
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          SHA: ${{ steps.release.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          slot="/home/${USER}/chaptera-reader-incoming/${SHA}"
          if ssh "${USER}@${HOST}"             "sudo -n /usr/local/sbin/chaptera-reader-deploy --version"             2>/dev/null | grep -q '^chaptera-reader-deploy-v1$'; then
            exit 0
          fi

          ssh "${USER}@${HOST}" "
            set -e
            if sudo -n true 2>/dev/null; then
              chmod 700 '${slot}/bootstrap-reader-deployer.sh'
              sudo -n bash '${slot}/bootstrap-reader-deployer.sh' '${USER}'
            else
              echo 'ROOT_BOOTSTRAP_REQUIRED'
              echo 'Run once as root: bash ${slot}/bootstrap-reader-deployer.sh ${USER}'
              exit 90
            fi
          "

      - name: Deploy Reader backend
        if: steps.current.outputs.already_current != 'true'
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          SHA: ${{ steps.release.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          archive="/home/${USER}/chaptera-reader-incoming/${SHA}/chaptera-cloud-reader-linux-amd64.tar.gz"
          ssh "${USER}@${HOST}"             "sudo -n /usr/local/sbin/chaptera-reader-deploy '${SHA}' '${archive}'"

      - name: Verify host rollback provenance after install
        if: steps.current.outputs.already_current != 'true'
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          SHA: ${{ steps.release.outputs.sha }}
          OLD_RELEASE: ${{ steps.current.outputs.installed_path }}
          PREVIOUS_BEFORE: ${{ steps.current.outputs.previous_path }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${SHA}" =~ ^[0-9a-f]{40}$ ]]
          expected="/opt/chaptera/releases/${SHA}"
          read_host_link() {
            ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "${USER}@${HOST}" "readlink -f /opt/chaptera/${1} 2>/dev/null || true"
          }
          actual="$(read_host_link current)"
          previous="$(read_host_link previous)"
          [[ "${actual}" == "${expected}" ]] || {
            echo "::error::Host current release does not match the installed immutable SHA"
            exit 1
          }
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "${USER}@${HOST}" "test -x '${expected}/chaptera'"

          if [[ -n "${OLD_RELEASE}" ]]; then
            [[ "${OLD_RELEASE}" =~ ^/opt/chaptera/releases/[0-9a-f]{40}$ ]] || {
              echo "::error::Original current pointer was not an immutable release"
              exit 1
            }
            if [[ "${OLD_RELEASE}" != "${expected}" ]]; then
              [[ "${previous}" == "${OLD_RELEASE}" ]] || {
                echo "::error::Host previous pointer does not preserve the last installed SHA"
                exit 1
              }
              ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "${USER}@${HOST}" "test -x '${previous}/chaptera'"
              echo "Host release pointers verified: current=${SHA}, previous=${OLD_RELEASE##*/}"
            else
              [[ "${previous}" == "${PREVIOUS_BEFORE}" ]] || {
                echo "::error::Idempotent reinstall changed the previous release pointer"
                exit 1
              }
              echo "Host current SHA verified; same-release reinstall preserved previous pointer"
            fi
          else
            [[ "${previous}" == "${PREVIOUS_BEFORE}" ]] || {
              echo "::error::Fresh install changed prior rollback pointer without a predecessor"
              exit 1
            }
            echo "Host current SHA verified; fresh install had no predecessor"
          fi
          # This is a read-only host provenance witness, not a rollback drill.

      - name: Real PUB physical acceptance
        if: steps.current.outputs.already_current != 'true'
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          SHA: ${{ steps.release.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          fixture_sha="ffed034ac87e679f0bd08ff9cf74ad11c0e0e510a42b1bc1a7502415f6c29c87"
          curl -fsSL             https://raw.githubusercontent.com/apache/poi/942d95d85b15d0dfdb3bc9ba1b4f273f277757c8/test-data/publisher/SampleBrochure.pub             -o /tmp/chaptera-reader-acceptance.pub
          echo "${fixture_sha}  /tmp/chaptera-reader-acceptance.pub" | sha256sum -c -
          scp /tmp/chaptera-reader-acceptance.pub             "${USER}@${HOST}:/home/${USER}/chaptera-reader-acceptance.pub"
          ssh "${USER}@${HOST}"             "python3 /opt/chaptera/current/run_cloud_reader_guest_host_acceptance.py               --fixture /home/${USER}/chaptera-reader-acceptance.pub               --out /home/${USER}/chaptera-reader-acceptance-${SHA}.json"

      - name: Public smoke
        if: steps.current.outputs.already_current != 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "=== public DNS ==="
          getent ahostsv4 reader.chaptera.online || true
          getent ahostsv6 reader.chaptera.online || true

          echo "=== HTTP must redirect to HTTPS ==="
          http_headers="$(mktemp)"
          curl -fsS -o /dev/null -D "${http_headers}" http://reader.chaptera.online/
          cat "${http_headers}"
          grep -Eq '^HTTP/[^ ]+ (301|308)' "${http_headers}"
          grep -Fqi 'Location: https://reader.chaptera.online/' "${http_headers}"

          echo "=== live TLS certificate ==="
          openssl s_client             -connect reader.chaptera.online:443             -servername reader.chaptera.online             -verify_return_error             </dev/null 2>/dev/null             | openssl x509 -noout -subject -issuer -dates -ext subjectAltName

          echo "=== HTTPS content ==="
          curl -fsS https://reader.chaptera.online/ | grep -q 'Chaptera'
          curl -fsS https://reader.chaptera.online/favicon.svg | grep -q '#315EF5'

          echo "=== Public temporary guest editor path allowlist ==="
          allowed=(
            /editor/temporary-preview
            /editor/temporary-editor-preview.mjs
            /editor/temporary-editor-preview.css
            /editor/temporary-edit-browser-session-v0.mjs
            /editor/temporary-edit-move-client-v1.mjs
            /editor/interaction-v1.mjs
            /editor/reader-scene-editor-interaction-v1.mjs
            /cloud-reader/render-v1.mjs
          )
          for path in "${allowed[@]}"; do
            actual="$(curl --silent --show-error --max-time 20 \
              --output /dev/null --write-out '%{http_code}' \
              "https://reader.chaptera.online${path}")"
            [[ "${actual}" == 200 ]] || {
              echo "::error::Public guest static path ${path} returned ${actual}, expected 200"
              exit 1
            }
          done

          echo "=== Public Product/OIDC/unlisted surface denylist ==="
          blocked=(
            /editor/product-editor-entry-v1.mjs
            /editor/temporary-preview-other
            /v1/editor/projects
            /v1/auth/session
          )
          for path in "${blocked[@]}"; do
            actual="$(curl --silent --show-error --max-time 20 \
              --output /dev/null --write-out '%{http_code}' \
              "https://reader.chaptera.online${path}")"
            [[ "${actual}" == 404 ]] || {
              echo "::error::Private/unlisted path ${path} returned ${actual}, expected 404"
              exit 1
            }
          done
          # HTTP 200 cannot prove that Nginx serves assets from the chosen
          # Chaptera Rust build; verify the actual public bytes separately.

      - name: Verify publicly served Guest UI and scripts match deployed rar2 commit
        if: steps.current.outputs.already_current != 'true'
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${RELEASE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          work="$(mktemp -d)"
          trap 'rm -rf "${work}"' EXIT
          # Guest HTML, CSS and JS are Rust include_bytes!, not chaptera-site
          # static files. Verify all three kinds of UI bytes on the PUBLIC
          # origin against the selected immutable RAR2 commit, not just JS.
          # This prevents a green deployment from serving stale editor chrome.
          for asset in \
            temporary-editor-preview.html \
            temporary-editor-preview.css \
            temporary-editor-preview.mjs \
            temporary-edit-browser-session-v0.mjs \
            temporary-edit-move-client-v1.mjs \
            interaction-v1.mjs \
            reader-scene-editor-interaction-v1.mjs
          do
            public_path="/editor/${asset}"
            if [[ "${asset}" == "temporary-editor-preview.html" ]]; then
              public_path="/editor/temporary-preview"
            fi
            curl --fail --location --silent --show-error --retry 3 \
              "https://raw.githubusercontent.com/Lalalalendia/rar2/${RELEASE_SHA}/apps/web/${asset}" \
              --output "${work}/expected"
            curl --fail --silent --show-error --max-time 20 \
              -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
              "https://reader.chaptera.online${public_path}" \
              --output "${work}/actual"
            if ! cmp --silent "${work}/expected" "${work}/actual"; then
              echo "::error::Public Guest asset ${asset} differs from selected rar2 release_sha"
              exit 1
            fi
            echo "Verified public Guest asset identity: ${asset}"
          done
          # Source-neutral receipts only: publish SHA and public asset names,
          # never private PUB contents, guest tokens or session IDs.
          echo "Public Guest HTML/CSS/JS assets match release ${RELEASE_SHA}"
          # The Reader landing page must be the exact immutable source asset,
          # not just any HTTP 200 carrying the Chaptera brand. This verifies
          # the separate Editor entry on the actual production Reader host.
          curl --fail --location --silent --show-error --retry 3             "https://raw.githubusercontent.com/Lalalalendia/rar2/${RELEASE_SHA}/apps/cloud-reader/index.html"             --output "${work}/reader-expected.html"
          curl --fail --silent --show-error --max-time 20             -H 'Cache-Control: no-cache' -H 'Pragma: no-cache'             "https://reader.chaptera.online/"             --output "${work}/reader-actual.html"
          cmp --silent "${work}/reader-expected.html" "${work}/reader-actual.html" || {
            echo "::error::Public Reader index differs from immutable rar2 release_sha"
            exit 1
          }
          grep -Fq 'id="temporary-editor-link"' "${work}/reader-actual.html"
          grep -Fq 'href="https://reader.chaptera.online/editor/temporary-preview"' "${work}/reader-actual.html"
          echo "Public Reader root HTML matches immutable release ${RELEASE_SHA}; Editor entry is present"
          # Full public browser upload/edit/IDML+PDF/delete stays a separate
          # operator acceptance gate; no production GO inferred here.

      - name: Auto-deploy summary
        if: always()
        shell: bash
        env:
          SHA: ${{ steps.release.outputs.sha }}
          ALREADY_CURRENT: ${{ steps.current.outputs.already_current }}
        run: |
          set -euo pipefail
          {
            echo "### Chaptera Reader production"
            echo
            echo "- event: \`${GITHUB_EVENT_NAME}\`"
            echo "- release: \`cloud-reader-${SHA}\`"
            if [[ "${ALREADY_CURRENT}" == "true" ]]; then
              echo "- result: no-op, exact release already installed"
            else
              echo "- result: deployment path executed; preceding steps are authoritative"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
  public-acceptance:
    name: Public Chromium edit/export/delete
    needs: deploy
    if: needs.deploy.result == 'success' && (needs.deploy.outputs.already_current != 'true' || github.event_name == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      RELEASE_SHA: ${{ needs.deploy.outputs.release_sha }}
      PUBLIC_ORIGIN: https://reader.chaptera.online
      FIXTURE_SHA256: 6a825ba26ba35d6e885acdc62e859591ed37cb0ff7480b554b9cb362b644dfcf
    steps:
      - name: Resolve protected rar2 acceptance harness
        id: harness
        shell: bash
        run: |
          set -euo pipefail
          [[ "${RELEASE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          harness_sha="$(curl -fsSL --retry 4 --retry-delay 2 \
            -H 'Accept: application/vnd.github+json' \
            https://api.github.com/repos/Lalalalendia/rar2/commits/main | jq -er .sha)"
          [[ "${harness_sha}" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=${harness_sha}" >> "${GITHUB_OUTPUT}"
          release_json="$(curl -fsSL --retry 4 --retry-delay 2 \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/Lalalalendia/rar2/releases/tags/cloud-reader-${RELEASE_SHA}")"
          printf '%s\n' "${release_json}" | jq -e --arg sha "${RELEASE_SHA}" '
            .draft == false and .target_commitish == $sha and
            (.assets | any(.name == "chaptera-cloud-reader-linux-amd64.tar.gz"))
          ' >/dev/null

      - name: Check out exact protected rar2 acceptance harness
        uses: actions/checkout@v4
        with:
          repository: Lalalalendia/rar2
          ref: ${{ steps.harness.outputs.sha }}
          path: rar2-harness
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify public acceptance harness and fetch pinned PUB
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq -- '--public-origin' rar2-harness/tools/run_temporary_editor_real_pub_browser.mjs
          mkdir -p "${RUNNER_TEMP}/public-v0"
          curl -fsSL --retry 4 --retry-delay 2 --max-time 100 \
            https://raw.githubusercontent.com/apache/poi/942d95d85b15d0dfdb3bc9ba1b4f273f277757c8/test-data/publisher/SampleNewsletter.pub \
            -o "${RUNNER_TEMP}/public-v0/fixture.pub"
          echo "${FIXTURE_SHA256}  ${RUNNER_TEMP}/public-v0/fixture.pub" | sha256sum -c -
          test "$(stat -c '%s' "${RUNNER_TEMP}/public-v0/fixture.pub")" = "291840"

      - name: Install pinned Chromium
        working-directory: rar2-harness
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Prove public Reader to separate Editor navigation in Chromium
        working-directory: rar2-harness
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import assert from "node:assert/strict";
          import { chromium } from "playwright";

          const root = "https://reader.chaptera.online";
          const editorUrl = root + "/editor/temporary-preview";
          const browser = await chromium.launch({headless: true});
          try {
            const context = await browser.newContext({
              viewport: {width: 1280, height: 900},
              acceptDownloads: false
            });
            for (const origin of [root + "/", "https://chaptera.online/cloud-reader/"]) {
              const page = await context.newPage();
              const mutations = [];
              page.on("request", request => {
                if (["POST", "PUT", "PATCH", "DELETE"].includes(request.method())) {
                  mutations.push({method: request.method(), path: new URL(request.url()).pathname});
                }
              });
              const response = await page.goto(origin, {
                waitUntil: "domcontentloaded", timeout: 30000
              });
              assert.equal(response?.status(), 200, "Reader page is not public HTTP 200");
              const link = page.locator("#temporary-editor-link");
              await link.waitFor({state: "visible", timeout: 15000});
              assert.equal(await link.getAttribute("href"), editorUrl);
              assert.equal(await link.getAttribute("target"), "_blank");
              assert.equal(await link.getAttribute("referrerpolicy"), "no-referrer");
              const rel = (await link.getAttribute("rel"))?.split(/\s+/) ?? [];
              assert.ok(rel.includes("noopener") && rel.includes("noreferrer"));
              assert.match(await link.getAttribute("aria-label") ?? "", /choose the PUB again/);
              for (const [width, height] of [[1280, 900], [390, 844], [320, 568]]) {
                await page.setViewportSize({width, height});
                const box = await link.boundingBox();
                assert.ok(box && box.width >= 60 && box.x >= -1 &&
                  box.x + box.width <= width + 1 && box.y >= -1 &&
                  box.y + box.height <= height + 1, "Edit PUB is clipped at " + width);
                assert.equal(await page.evaluate(() =>
                  document.documentElement.scrollWidth <= innerWidth + 1),
                  true, "Reader caused horizontal overflow at " + width);
              }
              if (origin === root + "/") {
                await page.setViewportSize({width: 1280, height: 900});
                // rel=noopener intentionally creates a detached top-level
                // browsing context. Context-level "page" events remain valid
                // even when no opener/popup relationship exists.
                const newTabPromise = context.waitForEvent("page", {timeout: 30000});
                await link.click();
                const editor = await newTabPromise;
                assert.notEqual(editor, page, "Edit PUB must open a separate tab");
                await editor.waitForLoadState("domcontentloaded", {timeout: 30000});
                assert.equal(await editor.evaluate(() => window.opener), null,
                  "noopener must prevent access to the Reader window");
                assert.equal(await editor.evaluate(() => document.referrer), "",
                  "noreferrer must not disclose the Reader page");
                const url = new URL(editor.url());
                assert.equal(url.origin, root);
                assert.equal(url.pathname, "/editor/temporary-preview");
                assert.equal(url.search, "", "Reader must not transfer query data");
                assert.equal(url.hash, "", "Reader must not transfer URL fragments");
                await editor.locator("#temporary-file").waitFor({
                  state: "attached", timeout: 15000
                });
                assert.equal(await editor.locator("#temporary-file").inputValue(), "",
                  "Editor must require a separate user upload");
                assert.equal(await editor.locator("#temporary-start").count(), 1);
                await editor.close();
              }
              assert.deepEqual(mutations, [], "Reader navigation must not mutate a Guest session");
              await page.close();
            }
            console.log(JSON.stringify({
              schema: "chaptera.reader-editor-public-navigation.v1",
              status: "PASS", origins: 2, viewports: [1280,390,320],
              separate_tab: true, separate_upload: true, bearer_transfer: false
            }));
          } finally {
            await browser.close();
          }
          JS

      - name: Real public Chromium MoveNode with IDML and PDF consumers
        id: browser
        working-directory: rar2-harness
        shell: bash
        run: |
          set -euo pipefail
          first_session=true
          for target in pdf idml; do
            if [[ "${first_session}" != true ]]; then
              # Two complete anonymous editor journeys from one GitHub runner
              # intentionally share the production IP rate-limit subject.
              # Respect the documented 60-second ReaderSessionOpen window
              # instead of weakening the server policy for a CI-only pattern.
              echo "Waiting for public Reader rate-limit window before second independent session"
              sleep 65
            fi
            first_session=false
            node tools/run_temporary_editor_real_pub_browser.mjs \
              --public-origin --origin "${PUBLIC_ORIGIN}" \
              --fixture "${RUNNER_TEMP}/public-v0/fixture.pub" \
              --fixture-sha256 "${FIXTURE_SHA256}" \
              --target "${target}" \
              --out "${RUNNER_TEMP}/public-v0/${target}.json"
          done

      - name: Record source-neutral acceptance identity
        if: always()
        env:
          HARNESS_SHA: ${{ steps.harness.outputs.sha }}
          BROWSER_OUTCOME: ${{ steps.browser.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${RELEASE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${HARNESS_SHA}" =~ ^[0-9a-f]{40}$ ]]
          mkdir -p "${RUNNER_TEMP}/public-v0"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "public-v0"
          context = {
              "schema": "chaptera.public-auto-deploy-context.v1",
              "release_sha": os.environ["RELEASE_SHA"],
              "harness_sha": os.environ["HARNESS_SHA"],
              "browser_outcome": os.environ["BROWSER_OUTCOME"],
          }
          (root / "source-free-context.json").write_text(
              json.dumps(context, indent=2, sort_keys=True) + "\n")
          PY

      - name: Require public edit export reload and DELETE receipts
        env:
          HARNESS_SHA: ${{ steps.harness.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'public-v0'
          for target in ('idml', 'pdf'):
              receipt = json.loads((root / f'{target}.json').read_text())
              assert receipt['status'] == 'PASS'
              assert receipt['deployment_mode'] == 'public_trusted_origin'
              assert receipt['public_trusted_tls'] is True
              assert receipt['tls_caddy'] is False
              assert receipt['export_target'] == target
              assert receipt['browser_pointer_commits'] == 1
              for key in ('exact_source_bound_revision', 'revised_scene_on_reload',
                          'same_browser_session_delete_proven',
                          'revoked_old_current_scene_export_denied',
                          'temporary_bearer_cleared_after_delete',
                          'original_pub_immutable', 'bearer_absent_from_urls'):
                  assert receipt[key] is True, key
              assert receipt[f'changed_{target}_geometry_proven'] is True
              assert receipt['v0_go'] is False
          summary = {
              'schema': 'chaptera.public-auto-deploy-acceptance.v1',
              'status': 'PASS',
              'release_sha': os.environ['RELEASE_SHA'],
              'harness_sha': os.environ['HARNESS_SHA'],
              'targets': ['idml', 'pdf'],
              'trusted_public_https': True,
              'edit_reload_delete': True,
              'v0_go': False,
          }
          (root / 'source-free-summary.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n')
          PY

      - name: Upload source-neutral public acceptance receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaptera-public-auto-deploy-acceptance-${{ needs.deploy.outputs.release_sha }}
          path: |
            ${{ runner.temp }}/public-v0/source-free-context.json
            ${{ runner.temp }}/public-v0/source-free-summary.json
          if-no-files-found: error
          retention-days: 14

