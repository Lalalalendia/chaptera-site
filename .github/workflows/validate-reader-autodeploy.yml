name: Validate Cloud Reader auto-deploy policy

on:
  pull_request:
    paths:
      - ".github/workflows/deploy-reader-backend.yml"
      - ".github/workflows/validate-reader-autodeploy.yml"
      - "cloud-reader/deploy/bootstrap-reader-deployer.sh"
      - ".github/workflows/reader-production-ttl-acceptance.yml"
      - "cloud-reader/acceptance/production_temporary_ttl.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-reader-backend.yml"
      - ".github/workflows/validate-reader-autodeploy.yml"
      - "cloud-reader/deploy/bootstrap-reader-deployer.sh"
      - ".github/workflows/reader-production-ttl-acceptance.yml"
      - "cloud-reader/acceptance/production_temporary_ttl.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Guard automatic deployment trust boundary
        shell: bash
        run: |
          set -euo pipefail
          workflow=".github/workflows/deploy-reader-backend.yml"

          grep -Fq 'cron: "*/10 * * * *"' "$workflow"
          grep -Fq 'workflow_dispatch:' "$workflow"
          grep -Fq '.target_commitish == $sha' "$workflow"
          grep -Fq 'compare/${sha}...main' "$workflow"
          grep -Fq '.behind_by == 0' "$workflow"
          grep -Fq 'select(.draft == false and .published_at != null)' "$workflow"
          grep -Fq 'max_by(.published_at)' "$workflow"
          grep -Fq 'chaptera-cloud-reader-linux-amd64.tar.gz' "$workflow"
          grep -Fq "steps.current.outputs.already_current != 'true'" "$workflow"
          grep -Fq 'readlink -f /opt/chaptera/current' "$workflow"
          grep -Fq 'previous_path=' "$workflow"
          grep -Fq 'Verify rollback-aware installer before host change' "$workflow"
          grep -Fq 'Verify host rollback provenance after install' "$workflow"
          grep -Fq 'readlink -f /opt/chaptera/previous' "$workflow"
          grep -Fq 'Host previous pointer does not preserve the last installed SHA' "$workflow"
          grep -Fq 'Idempotent reinstall changed the previous release pointer' "$workflow"
          grep -Fq 'Fresh install changed prior rollback pointer' "$workflow"
          # A UI-only release must not silently serve old HTML/CSS.
          grep -Fq 'Verify publicly served Guest UI and scripts match deployed rar2 commit' "$workflow"
          grep -Fq 'temporary-editor-preview.html' "$workflow"
          grep -Fq 'temporary-editor-preview.css' "$workflow"
          grep -Fq 'public_path="/editor/temporary-preview"' "$workflow"
          grep -Fq 'https://reader.chaptera.online${public_path}' "$workflow"
          grep -Fq 'cmp --silent "${work}/expected" "${work}/actual"' "$workflow"
          grep -Fq 'environment: production' "$workflow"
          ! grep -Fq 'workflow_run:' "$workflow"
          grep -Fq 'outputs:' "$workflow"
          grep -Fq 'release_sha: ${{ steps.release.outputs.sha }}' "$workflow"
          grep -Fq 'public-acceptance:' "$workflow"
          grep -Fq "needs: deploy" "$workflow"
          grep -Fq "needs.deploy.outputs.already_current != 'true'" "$workflow"
          grep -Fq 'repository: Lalalalendia/rar2' "$workflow"
          grep -Fq -- '--public-origin' "$workflow"
          grep -Fq 'run_temporary_editor_real_pub_browser.mjs' "$workflow"
          grep -Eq 'for target in (idml pdf|pdf idml); do' "$workflow"
          grep -Fq 'sleep 65' "$workflow"
          grep -Fq 'public Reader rate-limit window before second independent session' "$workflow"
          grep -Fq 'same_browser_session_delete_proven' "$workflow"
          grep -Fq 'revoked_old_current_scene_export_denied' "$workflow"
          grep -Fq 'chaptera.public-auto-deploy-context.v1' "$workflow"
          grep -Fq "'harness_sha': os.environ['HARNESS_SHA']" "$workflow"
          grep -Fq 'source-free-context.json' "$workflow"

      - name: Guard production Temporary Editor TTL witness
        shell: bash
        run: |
          set -euo pipefail
          ttl=".github/workflows/reader-production-ttl-acceptance.yml"
          script="cloud-reader/acceptance/production_temporary_ttl.py"
          grep -Fq 'cron: "17 3 * * *"' "$ttl"
          grep -Fq 'timeout-minutes: 75' "$ttl"
          grep -Fq 'max_by(.published_at)' "$ttl"
          grep -Fq 'https://reader.chaptera.online' "$ttl"
          grep -Fq 'Real public accepted edit and elapsed one-hour cleanup' "$ttl"
          ! grep -Fq 'secrets.' "$ttl"
          grep -Fq 'SLIDING_TTL_MS = 3_600_000' "$script"
          grep -Fq 'headers["Origin"] = ORIGIN' "$script"
          grep -Fq 'expired_current not in {404, 410}' "$script"
          grep -Fq 'identifier_or_bearer_emitted": False' "$script"
          python3 -m py_compile "$script"

      - name: Resolve current public immutable packet without deploying
        shell: bash
        run: |
          set -euo pipefail
          releases="$(curl -fsSL --retry 4 --retry-delay 2             -H 'Accept: application/vnd.github+json'             'https://api.github.com/repos/Lalalalendia/rar2/releases?per_page=30')"
          tag="$(printf '%s\n' "$releases" | jq -er '
            [.[] |
              select(.draft == false and .published_at != null) |
              select(.tag_name | test("^cloud-reader-[0-9a-f]{40}$")) |
              select(.assets | any(.name == "chaptera-cloud-reader-linux-amd64.tar.gz"))
            ] | max_by(.published_at) | .tag_name')"
          sha="${tag#cloud-reader-}"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]

          exact="$(curl -fsSL --retry 4 --retry-delay 2             -H 'Accept: application/vnd.github+json'             "https://api.github.com/repos/Lalalalendia/rar2/releases/tags/$tag")"
          printf '%s\n' "$exact" | jq -e --arg tag "$tag" --arg sha "$sha" '
            .tag_name == $tag and .draft == false and
            .target_commitish == $sha and
            (.assets | any(.name == "chaptera-cloud-reader-linux-amd64.tar.gz" and
              (.digest | strings | startswith("sha256:"))))
          ' >/dev/null

          compare="$(curl -fsSL --retry 4 --retry-delay 2             -H 'Accept: application/vnd.github+json'             "https://api.github.com/repos/Lalalalendia/rar2/compare/$sha...main")"
          printf '%s\n' "$compare" | jq -e '
            .behind_by == 0 and (.status == "ahead" or .status == "identical")
          ' >/dev/null

          echo "Validated auto-deploy candidate $tag"
