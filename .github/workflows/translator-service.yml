name: Stage / deploy private Gemini translator (pinned, no auto-install)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/translator-service.yml'
      - 'deploy/translator/bootstrap-host.sh'
      - 'deploy/translator/install-release.sh'
      - 'deploy/translator/verify-staged-release.sh'
      - 'deploy/translator/verify-full-cycle-zip-offline.py'
      - 'deploy/translator/pilot-chapter-offline.py'
      - 'deploy/translator/chaptera-translator-api.service'
      - 'deploy/translator/chaptera-translator-worker.service'
      - 'deploy/translator/chaptera-translator-drive-export.service'
      - 'deploy/translator/chaptera-translator-drive-export.timer'
      - 'deploy/translator/install-drive-export-units.sh'
      - 'deploy/translator/chaptera-translator-backup-drive.service'
      - 'deploy/translator/chaptera-translator-backup-drive.timer'
      - 'deploy/translator/install-backup-drive-units.sh'
      - 'deploy/translator/RE08_GOOGLE_DRIVE_BACKUP.md'
  pull_request:
    paths:
      - '.github/workflows/translator-service.yml'
      - 'deploy/translator/bootstrap-host.sh'
      - 'deploy/translator/install-release.sh'
      - 'deploy/translator/verify-staged-release.sh'
      - 'deploy/translator/verify-full-cycle-zip-offline.py'
      - 'deploy/translator/pilot-chapter-offline.py'
      - 'deploy/translator/chaptera-translator-api.service'
      - 'deploy/translator/chaptera-translator-worker.service'
      - 'deploy/translator/chaptera-translator-drive-export.service'
      - 'deploy/translator/chaptera-translator-drive-export.timer'
      - 'deploy/translator/install-drive-export-units.sh'
      - 'deploy/translator/chaptera-translator-backup-drive.service'
      - 'deploy/translator/chaptera-translator-backup-drive.timer'
      - 'deploy/translator/install-backup-drive-units.sh'
      - 'deploy/translator/RE08_GOOGLE_DRIVE_BACKUP.md'
  workflow_dispatch:
    inputs:
      install:
        description: 'NO: only stage on VPS; YES: activate systemd services after one-time root bootstrap'
        type: choice
        required: true
        default: 'NO'
        options: ['NO', 'YES']

permissions:
  contents: read

# Pull-request builds are read-only and have no production SSH staging.
# Cancel superseded commits on the SAME PR without blocking protected
# main/manual production staging, which remains serialized and non-cancellable.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('chaptera-translator-pr-{0}', github.event.pull_request.number) || 'chaptera-translator-private-service-deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    env:
      ARARRA_SHA: c3d7e544d70732525ea0ce0f8e39703106ea6476
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Lalalalendia/ararra
          ref: c3d7e544d70732525ea0ce0f8e39703106ea6476
          path: ararra
          persist-credentials: false
      - name: Verify exact Ararra version and protected main ancestry
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C ararra rev-parse HEAD)" = "$ARARRA_SHA"
          grep -Fq 'version = "0.6.2"' ararra/pyproject.toml
          # Rootless VPS stage now depends on the RE-08 recovery module.
          test -s ararra/src/chaptera_server/ops_backup.py
          test -s ararra/src/chaptera_server/ops_backup_crypto.py
          test -s ararra/src/chaptera_server/ops_backup_s3.py
          # RE-08 vault escrow: recovered SQLite is not enough to recover
          # moderator Gemini credentials without the original systemd master.
          test -s ararra/src/chaptera_server/ops_backup_vault.py
          # RE-08-GDRIVE-01: encrypted-only resumable off-host transport.
          test -s ararra/src/chaptera_server/ops_backup_drive.py
          test -s ararra/tests/test_ops_backup_drive.py
          grep -Fq 'def backup_once(' ararra/src/chaptera_server/ops_backup_drive.py
          grep -Fq 'def test_daily_backup_uploads_only_ciphertext_and_verified_readback(' ararra/tests/test_ops_backup_drive.py
          test -s ararra/tests/test_ops_backup_vault_escrow.py
          grep -Fq 'def verify_restored_vault(' ararra/src/chaptera_server/ops_backup_vault.py
          grep -Fq 'def test_vault_witness_checks_all_projects_not_only_first(' ararra/tests/test_ops_backup_vault_escrow.py
          grep -Fq 'RE-08-VAULT-ESCROW-01' ararra/docs/RE08_SQLITE_RECOVERY.md
          # RE-06 self-service keys must be in the PINNED upstream main.
          test -s ararra/src/chaptera_server/personal_gemini_keys.py
          test -s ararra/src/chaptera_server/member_gemini_provider.py
          test -s ararra/src/chaptera_server/http/routers/gemini_keys.py
          test -s ararra/src/chaptera_server/web_ui/static/js/gemini-cabinet-view.mjs
          # Release must include the merged RE-06C batch API and browser workflow.
          test -s ararra/src/chaptera_server/chapter_batches.py
          test -s ararra/src/chaptera_server/http/routers/batches.py
          test -s ararra/src/chaptera_server/web_ui/static/js/book-batch-view.mjs
          # RE-E2E-01: a complete offline, zero-Gemini-cost vertical regression
          # must ship with the exact release, not only in upstream main.
          test -s ararra/tests/test_release_vertical_slice.py
          grep -Fq 'def test_book_link_to_batch_to_draft_qa_and_both_export_boundaries' ararra/tests/test_release_vertical_slice.py
          # RE-06C: fail-closed personal project budget with a live SQLite read
          # under the same write transaction as each quota reservation.
          test -s ararra/tests/test_project_daily_caps.py
          grep -Fq 'def set_daily_cap(' ararra/src/chaptera_server/personal_gemini_keys.py
          grep -Fq 'limit_reader=live_cap' ararra/src/chaptera_server/member_gemini_provider.py
          grep -Fq 'con.execute("BEGIN IMMEDIATE")' ararra/src/chaptera_server/quota.py
          grep -Fq 'def test_missing_cap_never_sends_and_lowered_limit_stops_cached_provider' ararra/tests/test_project_daily_caps.py
          # Drive is manual-only until owner OAuth and first real E2E acceptance.
          test -s ararra/src/chaptera_server/drive_export.py
          test -s ararra/src/chaptera_server/drive_oauth_setup.py
          # RE-08-GDRIVE-03: restricted three-folder consent preserving the
          # original owner refresh token, with Windows and Linux regressions.
          test -s ararra/tests/test_drive_backup_oauth_grant.py
          grep -Fq 'backup_folder_id: str = ""' ararra/src/chaptera_server/drive_oauth_setup.py
          grep -Fq 'def test_three_folder_owner_consent_keeps_old_token_and_checks_every_folder' ararra/tests/test_drive_backup_oauth_grant.py
          grep -Fq 'drive-owner-refresh-token-backup-candidate.txt' ararra/scripts/connect-google-drive.ps1
          grep -Fq -- '--backup-folder-id' ararra/src/chaptera_server/cli.py
          test -s ararra/src/chaptera_server/drive_outbox.py
          # RE-MVP: explicit user consent, chapter-level Drive handoff,
          # readable TXT, and isolated 1/N chapter tests in the EXACT pin.
          test -s ararra/src/chaptera_server/batch_drive_consent.py
          test -s ararra/src/chaptera_server/chapter_plain_txt.py
          test -s ararra/tests/test_mvp_file_to_drive.py
          test -s ararra/tests/test_drive_export.py
          grep -Fq 'drive_export_requested: bool = False' ararra/src/chaptera_server/http/schemas.py
          grep -Fq 'def readable_txt(fragment: str)' ararra/src/chaptera_server/chapter_plain_txt.py
          grep -Fq 'from .chapter_plain_txt import readable_txt' ararra/src/chaptera_server/drive_export.py
          grep -Fq 'def test_one_uploaded_file_becomes_exactly_n_separate_drive_handoffs' ararra/tests/test_mvp_file_to_drive.py
          grep -Fq 'def test_consented_batch_exports_n_actual_readable_txt_pairs_without_overwrite' ararra/tests/test_drive_export.py
          grep -Fq -- '--consented-only' ararra/src/chaptera_server/cli.py
          # RE-02: Full Cycle App source ZIP is decoded by the manifest,
          # never re-parsed by chapter-heading heuristics.
          # Public Ararra CI must test both the importer and real exporter ZIP.
          test -s ararra/src/chaptera_server/full_cycle_archive.py
          test -s ararra/docs/RE02_FULL_CYCLE_ARCHIVE_IMPORT.md
          test -s ararra/tests/test_full_cycle_archive_import.py
          test -s ararra/tests/test_full_cycle_actual_exporter_compat.py
          test -s ararra/tests/fixtures/full_cycle_actual_exporter_20261017.zip.b64
          grep -Fq 'full_cycle_app.chapter_exchange' ararra/docs/RE02_FULL_CYCLE_ARCHIVE_IMPORT.md
          grep -Fq 'test_actual_full_cycle_exporter_zip_preview_commit_and_raw_readback' ararra/tests/test_full_cycle_actual_exporter_compat.py
          # Required for one shared moderator/book/(source,translation) root.
          grep -Fq 'CHAPTERA_DRIVE_ROOT_FOLDER_ID' ararra/src/chaptera_server/cli.py
          grep -Fq 'readeraPartFolder' ararra/src/chaptera_server/drive_export.py
          grep -Fq '"drive-outbox"' ararra/src/chaptera_server/cli.py
          grep -Fq 'gemini_vault_key=_read_systemd_credential' ararra/src/chaptera_server/config.py
          grep -Fq 'provider = MemberGeminiProviders(store, settings)' ararra/src/chaptera_server/cli.py
          grep -Fq 'offsite-s3 = ["boto3>=1.40,<2"]' ararra/pyproject.toml
          grep -Fq '"cryptography>=42,<49"' ararra/pyproject.toml
          # RE-03: one team key, no password login or password-based
          # moderator issuance. Forwarded client IP is trusted only from
          # the Nginx localhost peer, never from arbitrary remote clients.
          grep -Fq 'private_proxy = settings.bind == "127.0.0.1"' ararra/src/chaptera_server/cli.py
          grep -Fq 'forwarded_allow_ips="127.0.0.1"' ararra/src/chaptera_server/cli.py
          grep -Fq 'if kind != "team_key":' ararra/src/chaptera_server/team_sessions.py
          grep -Fq 'await accept(await auth.login(secret))' ararra/src/chaptera_server/web_ui/static/js/login-view.mjs
          # Anonymous browser must display only the key and submit button;
          # never reveal the navigation or team shell before session validation.
          grep -Fq 'data-authenticated="false"' ararra/src/chaptera_server/web_ui/templates/shell.html
          grep -Fq 'aria-label="Вход по ключу"' ararra/src/chaptera_server/web_ui/templates/shell.html
          grep -Fq 'body:not([data-authenticated="true"]) .sidebar' ararra/src/chaptera_server/web_ui/static/css/readera.css
          grep -Fq 'body:not([data-authenticated="true"]) #authenticated' ararra/src/chaptera_server/web_ui/static/css/readera.css
          grep -Fq "document.body.dataset.authenticated='true'" ararra/src/chaptera_server/web_ui/static/js/readera.mjs
          grep -Fq "document.body.dataset.authenticated='false'" ararra/src/chaptera_server/web_ui/static/js/login-view.mjs
          # RE-03: the initial anonymous HTML tab title must be generic,
          # with branding returned only after successful team-key session.
          grep -Fq '<title>Вход</title>' ararra/src/chaptera_server/web_ui/templates/shell.html
          if grep -Fq '<title>РидЭра' ararra/src/chaptera_server/web_ui/templates/shell.html; then
            echo 'error=anonymous_browser_title_leak' >&2; exit 2
          fi
          grep -Fq "document.title='РидЭра — переводческая платформа'" ararra/src/chaptera_server/web_ui/static/js/readera.mjs
          grep -Fq "document.title='Вход'" ararra/src/chaptera_server/web_ui/static/js/readera.mjs
          grep -Fq "document.title='Вход'" ararra/src/chaptera_server/web_ui/static/js/login-view.mjs
          # RE-04: compact authenticated workbench without a detached logout
          # row or a second nested source-job UI card. UI-only release.
          grep -Fq 'class="topbar-account"' ararra/src/chaptera_server/web_ui/templates/shell.html
          grep -Fq 'class="topbar-logout" id="logout"' ararra/src/chaptera_server/web_ui/templates/shell.html
          grep -Fq 'id="source-job-panel" class="source-job-panel"' ararra/src/chaptera_server/web_ui/templates/shell.html
          grep -Fq 'id="source-job-history" class="source-job-history"' ararra/src/chaptera_server/web_ui/templates/shell.html
          grep -Fq '.topbar-logout {' ararra/src/chaptera_server/web_ui/static/css/readera.css
          grep -Fq '#source-job-history {' ararra/src/chaptera_server/web_ui/static/css/readera.css
          # RE-02 archive-only: Full Cycle App performs all website crawling.
          # Keep ZIP v1 importer, library, editor, Gemini and Drive unchanged.
          # No source_* Python/JS files may be in the installed wheel.
          test -s ararra/src/chaptera_server/source_runtime.py
          test -s ararra/tests/test_archive_only_runtime.py
          test -s ararra/tools/check_archive_only_wheel.py
          test -s ararra/docs/RE02_ARCHIVE_ONLY_RELEASE.md
          test -s ararra/setup.py
          grep -Fq 'CHAPTERA_ARCHIVE_ONLY_BUILD' ararra/setup.py
          grep -Fq 'archive_only: bool = False' ararra/src/chaptera_server/config.py
          grep -Fq 'if not settings.archive_only:' ararra/src/chaptera_server/api.py
          grep -Fq 'source-worker unavailable:' ararra/src/chaptera_server/cli.py
          grep -Fq '{% if not archive_only %}' ararra/src/chaptera_server/web_ui/templates/shell.html
          grep -Fq "await import('./source-book-import-view.mjs')" ararra/src/chaptera_server/web_ui/static/js/readera.mjs
          grep -Fqx 'Environment=CHAPTERA_ARCHIVE_ONLY=1' deploy/translator/chaptera-translator-api.service
          grep -Fqx 'Environment=CHAPTERA_ARCHIVE_ONLY=1' deploy/translator/chaptera-translator-worker.service
          grep -Fq 'CHAPTERA_ARCHIVE_ONLY_BUILD=1' deploy/translator/manual-stage-no-actions.sh
          grep -Fq 'archive_only=True' deploy/translator/verify-full-cycle-zip-offline.py
          # Timotxt source-worker remains disabled by the normal installer.
          # Do not enable the optional source-worker in the normal rollout.
          # Reading the legacy unit's active state is allowed; starting it is not.
          if grep -Eq 'systemctl[[:space:]]+(enable|start|restart).*source-worker|touch[[:space:]].*source-collection-enabled' deploy/translator/install-release.sh; then
            echo 'error=source_worker_activation_forbidden' >&2; exit 2
          fi
          grep -Fq 'error=active_legacy_source_worker_forbidden_in_archive_release' deploy/translator/install-release.sh
          # Installer must verify effective on-host systemd unit settings before
          # switching symlink to a wheel that has no legacy parser modules.
          grep -Fq 'error=missing_archive_only_runtime_unit_' deploy/translator/install-release.sh
          grep -Fq 'systemctl show --property=Environment --value' deploy/translator/install-release.sh
          grep -Fq 'CHAPTERA_ARCHIVE_ONLY=1' deploy/translator/chaptera-translator-api.service
          grep -Fq 'CHAPTERA_ARCHIVE_ONLY=1' deploy/translator/chaptera-translator-worker.service
          if grep -Fq 'class="workspace-actions"' ararra/src/chaptera_server/web_ui/templates/shell.html; then
            echo 'error=detached_logout_row_forbidden' >&2; exit 2
          fi
          if grep -Fq '@router.post("/v1/session/password"' ararra/src/chaptera_server/http/routers/session.py; then
            echo 'error=legacy_password_login_forbidden' >&2; exit 2
          fi
          if grep -Fq '@router.post("/v1/admin/members/{member_id}/password")' ararra/src/chaptera_server/http/routers/identity.py; then
            echo 'error=legacy_password_issue_forbidden' >&2; exit 2
          fi
          grep -Fqx 'Environment=CHAPTERA_ADMIN_MEMBER_ID=operator' deploy/translator/chaptera-translator-api.service
          grep -Fqx 'LoadCredential=gemini_vault_key:/etc/chaptera-translator/credentials/gemini_vault_key' deploy/translator/chaptera-translator-api.service
          grep -Fqx 'LoadCredential=gemini_vault_key:/etc/chaptera-translator/credentials/gemini_vault_key' deploy/translator/chaptera-translator-worker.service
          # Explicit rejection, never negated grep under set -e (bash ignores
          # errexit inside ! commands). Match actual CI secret references,
          # not the validation expression itself.
          if grep -Fq 'LoadCredential=gemini_api_key:' deploy/translator/chaptera-translator-worker.service; then
            echo 'error=legacy_worker_key_forbidden' >&2; exit 2
          fi
          if grep -Fq 'gemini_api_key' deploy/translator/install-release.sh; then
            echo 'error=legacy_installer_key_forbidden' >&2; exit 2
          fi
          if grep -REq 'secrets[.]TRANSLATOR_GEMINI_API_KEY' .github/workflows/; then
            echo 'error=legacy_secret_reference_forbidden' >&2; exit 2
          fi
          grep -Fq 'secrets.token_bytes(32)' deploy/translator/bootstrap-host.sh
          grep -Fqx 'Environment=CHAPTERA_BIND=127.0.0.1' deploy/translator/chaptera-translator-api.service
          grep -Fqx 'Environment=CHAPTERA_PORT=8091' deploy/translator/chaptera-translator-api.service
          bash -n deploy/translator/bootstrap-host.sh
          bash -n deploy/translator/install-release.sh
          bash -n deploy/translator/install-drive-export-units.sh
          bash -n deploy/translator/install-backup-drive-units.sh
          # Inert-by-default: never create an active root timer from CI.
          if grep -Eq 'systemctl[[:space:]]+(enable|start|restart|preset)' deploy/translator/install-backup-drive-units.sh; then
            echo 'error=backup_drive_installer_must_be_inert' >&2; exit 2
          fi
          grep -Fqx 'ConditionPathExists=/etc/chaptera-translator/backup-drive-enabled' deploy/translator/chaptera-translator-backup-drive.service
          grep -Fqx 'LoadCredential=backup_rbe_key:/etc/chaptera-translator/backup/backup_rbe_key' deploy/translator/chaptera-translator-backup-drive.service
          grep -Fq 'ops_backup_drive --run-once --allow-upload' deploy/translator/chaptera-translator-backup-drive.service
          grep -Fqx 'OnCalendar=*-*-* 03:30:00 UTC' deploy/translator/chaptera-translator-backup-drive.timer
          # Reviewed installer must never activate services or the Google timer.
          if grep -Eq 'systemctl[[:space:]]+(enable|start|restart|preset)' deploy/translator/install-drive-export-units.sh; then
            echo 'error=drive_export_installer_must_be_inert' >&2; exit 2
          fi
          # OAuth refresh token belongs ONLY to the inert one-shot exporter.
          grep -Fqx 'ExecStart=/opt/chaptera-translator/current/venv/bin/chaptera-server drive-outbox --run-once --allow-drive-write' deploy/translator/chaptera-translator-drive-export.service
          grep -Fqx 'ConditionPathExists=/etc/chaptera-translator/drive-export-enabled' deploy/translator/chaptera-translator-drive-export.service
          grep -Fqx 'ConditionPathExists=/etc/chaptera-translator/drive-export.env' deploy/translator/chaptera-translator-drive-export.service
          grep -Fqx 'EnvironmentFile=/etc/chaptera-translator/drive-export.env' deploy/translator/chaptera-translator-drive-export.service
          grep -Fqx 'LoadCredential=google_drive_refresh_token:/etc/chaptera-translator/google-drive/google_drive_refresh_token' deploy/translator/chaptera-translator-drive-export.service
          grep -Fqx 'OnCalendar=*-*-* *:0/2:00' deploy/translator/chaptera-translator-drive-export.timer
          if grep -Eq 'google_drive_(client|refresh)' deploy/translator/chaptera-translator-api.service deploy/translator/chaptera-translator-worker.service; then
            echo 'error=oauth_exposure_to_long_lived_service' >&2; exit 2
          fi
          bash -n deploy/translator/verify-staged-release.sh
          test -s deploy/translator/verify-full-cycle-zip-offline.py
          python -m py_compile deploy/translator/verify-full-cycle-zip-offline.py
          # The offline VPS stage must verify encryption and Google readback
          # without real external Drive requests or production SQLite access.
          grep -Fq 'stage_drive_encrypted_backup_roundtrip=PASS' deploy/translator/verify-staged-release.sh
          grep -Fq 'stage_drive_backup_network_calls=0' deploy/translator/verify-staged-release.sh
          grep -Fq 'stage_drive_three_folder_picker=PASS' deploy/translator/verify-staged-release.sh
          grep -Fq 'stage_drive_legacy_two_folder_picker=PASS' deploy/translator/verify-staged-release.sh
          grep -Fq 'stage_drive_oauth_network_calls=0' deploy/translator/verify-staged-release.sh
          grep -Fq 'stage_mvp_readable_chapter_txt=PASS' deploy/translator/verify-staged-release.sh
          grep -Fq 'stage_mvp_gemini_network_calls=0' deploy/translator/verify-staged-release.sh
          grep -Fq 'stage_mvp_drive_network_calls=0' deploy/translator/verify-staged-release.sh
          grep -Fq 'verify-full-cycle-zip-offline.py' deploy/translator/verify-staged-release.sh
          grep -Fq 'stage_full_cycle_zip_atomic_import=PASS' deploy/translator/verify-full-cycle-zip-offline.py
          grep -Fq 'stage_full_cycle_zip_original_readback=PASS' deploy/translator/verify-full-cycle-zip-offline.py
          grep -Fq 'stage_full_cycle_zip_network_calls=0' deploy/translator/verify-full-cycle-zip-offline.py
          grep -Fq 'stage_full_cycle_zip_http_preview_import=PASS' deploy/translator/verify-full-cycle-zip-offline.py
          grep -Fq 'stage_full_cycle_zip_http_auth_isolation=PASS' deploy/translator/verify-full-cycle-zip-offline.py
          grep -Fq 'stage_full_cycle_zip_http_restart_readback=PASS' deploy/translator/verify-full-cycle-zip-offline.py
          # Installation is forbidden unless the exact staged packet has
          # completed every rootless offline smoke, including Full Cycle ZIP.
          grep -Fq 'translator_stage_offline_acceptance=PASS' deploy/translator/verify-staged-release.sh
          grep -Fq 'STAGED_SMOKE_SHA256' deploy/translator/verify-staged-release.sh
          grep -Fq 'error=missing_accepted_offline_stage' deploy/translator/install-release.sh
          grep -Fq 'error=stage_acceptance_packet_mismatch' deploy/translator/install-release.sh
          # Regression against staging a worker that would run without the
          # new Gemini budget or fail to verify independent vault escrow.
          grep -Fq 'assert store.claim_next(require_personal_key=True) is None' deploy/translator/verify-staged-release.sh
          grep -Fq 'stage_personal_gemini_vault_recovery=PASS' deploy/translator/verify-staged-release.sh
          grep -Fq 'stage_personal_gemini_rpd_caps=PASS' deploy/translator/verify-staged-release.sh
          grep -Fq 'gemini_reserved_output_tokens=0, archive_only=True,' deploy/translator/verify-staged-release.sh
          # RE-02 first-pilot acceptance must remain synthetic and isolated.
          grep -Fq 'stage_archive_only_crawler_routes=DENIED' deploy/translator/verify-staged-release.sh
          grep -Fq 'stage_archive_only_modules=ABSENT' deploy/translator/verify-staged-release.sh
          grep -Fq 'stage_archive_only_source_worker=DENIED' deploy/translator/verify-staged-release.sh
          grep -Fq 'stage_archive_only_zip_upload_ui=PASS' deploy/translator/verify-staged-release.sh
          grep -Fq 'stage_archive_only_source_modules=ABSENT' deploy/translator/verify-full-cycle-zip-offline.py
          grep -Fq 'stage_archive_only_http_crawler_routes=DENIED' deploy/translator/verify-full-cycle-zip-offline.py
          grep -Fq 'production_sqlite_access=no' deploy/translator/verify-staged-release.sh
          python -m py_compile deploy/translator/pilot-chapter-offline.py
          curl -fsSL --retry 3 -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/Lalalalendia/ararra/compare/$ARARRA_SHA...main" \
            | jq -e '(.status == "ahead" or .status == "identical") and .behind_by == 0' >/dev/null
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build tested, hash-verified, offline wheelhouse
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e './ararra[test]'
          (cd ararra && pytest -q && python tools/check_architecture.py && python tools/check_archive_only_wheel.py)
          mkdir -p .translator-packet/wheelhouse
          CHAPTERA_ARCHIVE_ONLY_BUILD=1 python -m pip wheel --wheel-dir .translator-packet/wheelhouse './ararra[offsite-s3]'
          python -m pip wheel --wheel-dir .translator-packet/wheelhouse pip
          printf '%s\n' "$ARARRA_SHA" > .translator-packet/SOURCE_SHA
          cp ararra/tests/fixtures/full_cycle_actual_exporter_20261017.zip.b64 .translator-packet/full-cycle-exporter.zip.b64
          cp deploy/translator/verify-full-cycle-zip-offline.py .translator-packet/verify-full-cycle-zip-offline.py
          (cd .translator-packet && sha256sum wheelhouse/*.whl full-cycle-exporter.zip.b64 verify-full-cycle-zip-offline.py > SHA256SUMS)
          tar -czf translator-wheelhouse.tar.gz -C .translator-packet .
          sha256sum translator-wheelhouse.tar.gz > translator-wheelhouse.sha256
      - name: Validate chapter-086 structural mock against pinned Ararra on runner
        shell: bash
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/fixture-086.txt"
          curl -fsSL --retry 2 --max-time 45 \
            'https://raw.githubusercontent.com/Lalalalendia/med/5046ff53207ce2fc89fb83277d9ceec1fee30935/corpora/fanqie/xianjie-jijian/full/chapters/086_author-086_7628922407947862553.txt' \
            -o "$fixture"
          test "$(git hash-object "$fixture")" = db53f9b07821d4a28ba35badb0da362613a39e50
          env -u CHAPTERA_GEMINI_API_KEY -u CREDENTIALS_DIRECTORY \
            timeout 120s python deploy/translator/pilot-chapter-offline.py "$fixture" \
            > "$RUNNER_TEMP/chapter-086-report.json"
          python - "$RUNNER_TEMP/chapter-086-report.json" <<'PY'
          import json,sys
          report=json.load(open(sys.argv[1],encoding='utf-8'))
          assert report['schema'] == 'chaptera-real-source-offline-v1'
          assert report['gemini_network_calls'] == 0
          assert all(item['status'] == 'PASS' for item in report['results'])
          for item in report['results']:
              print(f"runner_real_chapter_{item['transport']}=PASS")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: chaptera-translator-0.6.2-pinned-wheelhouse
          path: |
            translator-wheelhouse.tar.gz
            translator-wheelhouse.sha256
          if-no-files-found: error
          retention-days: 5

  stage:
    needs: build
    # No active VPS. Offline wheel build remains enabled; never SSH/install.
    if: ${{ false }}
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 9
    env:
      ARARRA_SHA: c3d7e544d70732525ea0ce0f8e39703106ea6476
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: chaptera-translator-0.6.2-pinned-wheelhouse
      - name: Verify distribution integrity before SSH
        run: |
          set -euo pipefail
          sha256sum -c translator-wheelhouse.sha256
          grep -Fqx 'Environment=CHAPTERA_ADMIN_MEMBER_ID=operator' deploy/translator/chaptera-translator-api.service
          grep -Fqx 'LoadCredential=gemini_vault_key:/etc/chaptera-translator/credentials/gemini_vault_key' deploy/translator/chaptera-translator-api.service
          grep -Fqx 'LoadCredential=gemini_vault_key:/etc/chaptera-translator/credentials/gemini_vault_key' deploy/translator/chaptera-translator-worker.service
          # Explicit rejection, never negated grep under set -e (bash ignores
          # errexit inside ! commands). Match actual CI secret references,
          # not the validation expression itself.
          if grep -Fq 'LoadCredential=gemini_api_key:' deploy/translator/chaptera-translator-worker.service; then
            echo 'error=legacy_worker_key_forbidden' >&2; exit 2
          fi
          if grep -Fq 'gemini_api_key' deploy/translator/install-release.sh; then
            echo 'error=legacy_installer_key_forbidden' >&2; exit 2
          fi
          if grep -REq 'secrets[.]TRANSLATOR_GEMINI_API_KEY' .github/workflows/; then
            echo 'error=legacy_secret_reference_forbidden' >&2; exit 2
          fi
          grep -Fq 'secrets.token_bytes(32)' deploy/translator/bootstrap-host.sh
          grep -Fqx 'Environment=CHAPTERA_BIND=127.0.0.1' deploy/translator/chaptera-translator-api.service
          grep -Fqx 'Environment=CHAPTERA_PORT=8091' deploy/translator/chaptera-translator-api.service
          bash -n deploy/translator/bootstrap-host.sh
          bash -n deploy/translator/install-release.sh
          bash -n deploy/translator/install-drive-export-units.sh
          bash -n deploy/translator/install-backup-drive-units.sh
          # Inert-by-default: never create an active root timer from CI.
          if grep -Eq 'systemctl[[:space:]]+(enable|start|restart|preset)' deploy/translator/install-backup-drive-units.sh; then
            echo 'error=backup_drive_installer_must_be_inert' >&2; exit 2
          fi
          grep -Fqx 'ConditionPathExists=/etc/chaptera-translator/backup-drive-enabled' deploy/translator/chaptera-translator-backup-drive.service
          grep -Fqx 'LoadCredential=backup_rbe_key:/etc/chaptera-translator/backup/backup_rbe_key' deploy/translator/chaptera-translator-backup-drive.service
          grep -Fq 'ops_backup_drive --run-once --allow-upload' deploy/translator/chaptera-translator-backup-drive.service
          grep -Fqx 'OnCalendar=*-*-* 03:30:00 UTC' deploy/translator/chaptera-translator-backup-drive.timer
          # Reviewed installer must never activate services or the Google timer.
          if grep -Eq 'systemctl[[:space:]]+(enable|start|restart|preset)' deploy/translator/install-drive-export-units.sh; then
            echo 'error=drive_export_installer_must_be_inert' >&2; exit 2
          fi
          # OAuth refresh token belongs ONLY to the inert one-shot exporter.
          grep -Fqx 'ExecStart=/opt/chaptera-translator/current/venv/bin/chaptera-server drive-outbox --run-once --allow-drive-write' deploy/translator/chaptera-translator-drive-export.service
          grep -Fqx 'ConditionPathExists=/etc/chaptera-translator/drive-export-enabled' deploy/translator/chaptera-translator-drive-export.service
          grep -Fqx 'ConditionPathExists=/etc/chaptera-translator/drive-export.env' deploy/translator/chaptera-translator-drive-export.service
          grep -Fqx 'EnvironmentFile=/etc/chaptera-translator/drive-export.env' deploy/translator/chaptera-translator-drive-export.service
          grep -Fqx 'LoadCredential=google_drive_refresh_token:/etc/chaptera-translator/google-drive/google_drive_refresh_token' deploy/translator/chaptera-translator-drive-export.service
          grep -Fqx 'OnCalendar=*-*-* *:0/2:00' deploy/translator/chaptera-translator-drive-export.timer
          if grep -Eq 'google_drive_(client|refresh)' deploy/translator/chaptera-translator-api.service deploy/translator/chaptera-translator-worker.service; then
            echo 'error=oauth_exposure_to_long_lived_service' >&2; exit 2
          fi
          bash -n deploy/translator/verify-staged-release.sh
          test -s deploy/translator/verify-full-cycle-zip-offline.py
          python -m py_compile deploy/translator/verify-full-cycle-zip-offline.py
          # The offline VPS stage must verify encryption and Google readback
          # without real external Drive requests or production SQLite access.
          grep -Fq 'stage_drive_encrypted_backup_roundtrip=PASS' deploy/translator/verify-staged-release.sh
          grep -Fq 'stage_drive_backup_network_calls=0' deploy/translator/verify-staged-release.sh
          grep -Fq 'stage_drive_three_folder_picker=PASS' deploy/translator/verify-staged-release.sh
          grep -Fq 'stage_drive_legacy_two_folder_picker=PASS' deploy/translator/verify-staged-release.sh
          grep -Fq 'stage_drive_oauth_network_calls=0' deploy/translator/verify-staged-release.sh
          grep -Fq 'stage_mvp_readable_chapter_txt=PASS' deploy/translator/verify-staged-release.sh
          grep -Fq 'stage_mvp_gemini_network_calls=0' deploy/translator/verify-staged-release.sh
          grep -Fq 'stage_mvp_drive_network_calls=0' deploy/translator/verify-staged-release.sh
          grep -Fq 'verify-full-cycle-zip-offline.py' deploy/translator/verify-staged-release.sh
          grep -Fq 'stage_full_cycle_zip_atomic_import=PASS' deploy/translator/verify-full-cycle-zip-offline.py
          grep -Fq 'stage_full_cycle_zip_original_readback=PASS' deploy/translator/verify-full-cycle-zip-offline.py
          grep -Fq 'stage_full_cycle_zip_network_calls=0' deploy/translator/verify-full-cycle-zip-offline.py
          grep -Fq 'stage_full_cycle_zip_http_preview_import=PASS' deploy/translator/verify-full-cycle-zip-offline.py
          grep -Fq 'stage_full_cycle_zip_http_auth_isolation=PASS' deploy/translator/verify-full-cycle-zip-offline.py
          grep -Fq 'stage_full_cycle_zip_http_restart_readback=PASS' deploy/translator/verify-full-cycle-zip-offline.py
          # Installation is forbidden unless the exact staged packet has
          # completed every rootless offline smoke, including Full Cycle ZIP.
          grep -Fq 'translator_stage_offline_acceptance=PASS' deploy/translator/verify-staged-release.sh
          grep -Fq 'STAGED_SMOKE_SHA256' deploy/translator/verify-staged-release.sh
          grep -Fq 'error=missing_accepted_offline_stage' deploy/translator/install-release.sh
          grep -Fq 'error=stage_acceptance_packet_mismatch' deploy/translator/install-release.sh
          # Regression against staging a worker that would run without the
          # new Gemini budget or fail to verify independent vault escrow.
          grep -Fq 'assert store.claim_next(require_personal_key=True) is None' deploy/translator/verify-staged-release.sh
          grep -Fq 'stage_personal_gemini_vault_recovery=PASS' deploy/translator/verify-staged-release.sh
          grep -Fq 'stage_personal_gemini_rpd_caps=PASS' deploy/translator/verify-staged-release.sh
          grep -Fq 'gemini_reserved_output_tokens=0, archive_only=True,' deploy/translator/verify-staged-release.sh
          python -m py_compile deploy/translator/pilot-chapter-offline.py
      - name: Configure pinned SSH identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY" && test -n "$SSH_KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Stage and verify release without starting services
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$USER"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$USER@$HOST" \
            "install -d -m 700 'chaptera-translator-incoming/$ARARRA_SHA'"
          # Pin the complete authentic chapter by *both* med commit and git blob;
          # only hash/size and redacted metrics appear in logs or artifacts.
          source_fixture="$RUNNER_TEMP/fixture-086.txt"
          curl -fsSL --retry 2 --max-time 45 \
            'https://raw.githubusercontent.com/Lalalalendia/med/5046ff53207ce2fc89fb83277d9ceec1fee30935/corpora/fanqie/xianjie-jijian/full/chapters/086_author-086_7628922407947862553.txt' \
            -o "$source_fixture"
          test "$(git hash-object "$source_fixture")" = db53f9b07821d4a28ba35badb0da362613a39e50
          (cd "$RUNNER_TEMP" && sha256sum fixture-086.txt > fixture-086.sha256)
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes \
            translator-wheelhouse.tar.gz translator-wheelhouse.sha256 \
            "$source_fixture" "$RUNNER_TEMP/fixture-086.sha256" \
            deploy/translator/bootstrap-host.sh deploy/translator/install-release.sh \
            deploy/translator/verify-staged-release.sh deploy/translator/pilot-chapter-offline.py \
            deploy/translator/chaptera-translator-api.service \
            deploy/translator/chaptera-translator-worker.service \
            deploy/translator/chaptera-translator-drive-export.service \
            deploy/translator/chaptera-translator-drive-export.timer \
            deploy/translator/install-drive-export-units.sh \
            deploy/translator/chaptera-translator-backup-drive.service \
            deploy/translator/chaptera-translator-backup-drive.timer \
            deploy/translator/install-backup-drive-units.sh \
            "$USER@$HOST:chaptera-translator-incoming/$ARARRA_SHA/"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$USER@$HOST" \
            "cd 'chaptera-translator-incoming/$ARARRA_SHA' && sha256sum -c translator-wheelhouse.sha256 --status && echo translator_staging=PASS"
          echo 'Staged release and reviewed root bootstrap; services were not changed.'
      - name: Verify staged 0.6.2 against actual VPS (offline, transient only)
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$USER"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$USER@$HOST" \
            "bash 'chaptera-translator-incoming/$ARARRA_SHA/verify-staged-release.sh' '$ARARRA_SHA'"
      - name: Activate personal-key translator services (explicit install=YES only)
        if: github.event_name == 'workflow_dispatch' && inputs.install == 'YES'
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          # No global Gemini credential exists in personal-key mode: no secret
          # from Actions is sent to the VPS, and no paid call is made here.
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$USER@$HOST" \
            "test -f /etc/chaptera-translator/.bootstrapped && test -s /etc/chaptera-translator/credentials/gemini_vault_key" || {
              echo 'One-time root bootstrap/vault missing. Leave services unchanged.'
              exit 3
            }
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$USER@$HOST" \
            "bash 'chaptera-translator-incoming/$ARARRA_SHA/install-release.sh' '$ARARRA_SHA'"
      - name: Record no-billable-deploy scope
        if: always()
        run: |
          echo 'No paid Gemini translation requests are executed by this workflow.'
          echo 'Translator API, if installed, binds only 127.0.0.1:8091.'
